name: Docs

# The site in `docs/` is deployed by Pages from this workflow. The generated pages are rebuilt
# here, so a page that no longer matches the interfaces fails the build instead of shipping.

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "scripts/**"
      - "src/**"
      - "moon.mod"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: interfaces
        run: |
          moon update
          moon info --target native

      - name: API page is current
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      # The tour plays a run of this library. The recording is made here, from this commit, and
      # the page is not deployed with a transcript older than the code.
      - name: record the runs the tour plays
        run: |
          moon build --target native src/examples/browser
          mkdir -p docs/engine
          ./_build/native/debug/build/examples/browser/browser.exe > docs/engine/tour.json
          test -s docs/engine/tour.json
          python3 - <<'PY'
          import json
          data = json.load(open("docs/engine/tour.json", encoding="utf-8"))
          runs = data["scenarios"]
          assert len(runs) == 3, runs
          for run in runs:
              steps = run["run"]["steps"]
              assert steps and steps[-1]["kind"] in {"answer", "stop"}, run["id"]
          print("recorded", len(runs), "runs:", ", ".join(one["id"] for one in runs))
          PY

      - name: configure pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
